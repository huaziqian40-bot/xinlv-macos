<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>情绪小西瓜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf8f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.game-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:8px}
.game-hud{display:flex;align-items:center;gap:1rem;width:100%;max-width:360px;margin-bottom:6px;padding:0 4px}
.hud-item{font-size:12px;color:#999;text-align:center;line-height:1.3}
.hud-item b{font-size:16px;color:#333;display:block}
.btn-restart{margin-left:auto;padding:7px 16px;border:none;border-radius:10px;background:#e7623e;color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(231,98,62,.3);-webkit-tap-highlight-color:transparent;transition:transform .15s,box-shadow .15s}
.btn-restart:active{transform:scale(.95);box-shadow:0 1px 3px rgba(231,98,62,.2)}
.game-stage-wrap{position:relative;width:360px;max-width:100%}
#g-canvas{width:360px;max-width:100%;aspect-ratio:360/520;display:block;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:1px solid #eee;cursor:pointer;touch-action:pan-y}
.game-over{position:absolute;inset:0;background:rgba(250,248,245,.92);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;border-radius:12px;text-align:center;animation:fadeIn .25s ease;z-index:10}
.game-over p{margin:4px 0;font-size:16px;font-weight:600;color:#333}
.game-over .muted{font-size:13px;font-weight:400;color:#999}
.game-over .btn-retry{margin-top:8px;padding:10px 24px;background:#e7623e;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(231,98,62,.3);-webkit-tap-highlight-color:transparent;transition:transform .15s,box-shadow .15s}
.game-over .btn-retry:active{transform:scale(.95);box-shadow:0 1px 3px rgba(231,98,62,.2)}
.game-hint{font-size:11px;color:#aaa;max-width:360px;margin-top:6px;text-align:center;line-height:1.4;padding:0 12px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="game-wrap">
  <div class="game-hud">
    <div class="hud-item">分数<b id="g-score">0</b></div>
    <div class="hud-item">最高分<b id="g-best">0</b></div>
    <button class="btn-restart" id="g-restart">重来</button>
  </div>
  <div class="game-stage-wrap">
    <canvas id="g-canvas" width="360" height="520"></canvas>
    <div id="g-over" class="game-over" style="display:none">
      <div>
        <p>游戏结束啦</p>
        <p class="muted">本局得分：<b id="g-final">0</b></p>
        <button class="btn-retry" id="g-retry">再来一局</button>
      </div>
    </div>
  </div>
  <p class="game-hint">点按直接落下水果；按住左右滑动瞄准、松手落下；上下滑动是滚动页面，不会误落。相同水果碰到一起会合成更大的哦～</p>
</div>

<script>
(function(){
  // ===== 主题颜色（由 Android 端注入覆盖） =====
  window.__theme = {
    bg: '#faf8f5',
    card: '#fff',
    accent: '#e7623e',
    ink: '#333',
    inkSoft: '#999',
    canvasBg: '#fff'
  };
  window.applyTheme = function(bg, card, accent, ink, inkSoft, canvasBg) {
    var t = window.__theme;
    t.bg = bg; t.card = card; t.accent = accent; t.ink = ink; t.inkSoft = inkSoft;
    t.canvasBg = canvasBg || card;
    // CSS 样式更新
    document.body.style.background = bg;
    var cv = document.getElementById('g-canvas');
    cv.style.background = t.canvasBg;
    cv.style.borderColor = inkSoft;
    document.querySelectorAll('.hud-item').forEach(function(el){el.style.color = inkSoft});
    document.querySelectorAll('.hud-item b').forEach(function(el){el.style.color = ink});
    var hint = document.querySelector('.game-hint');
    if(hint) hint.style.color = inkSoft;
    document.querySelectorAll('.btn-restart, .btn-retry').forEach(function(el){
      el.style.background = accent;
      el.style.boxShadow = '0 2px 6px ' + accent + '4d';
    });
    var over = document.getElementById('g-over');
    over.style.background = bg + 'eb';
    document.querySelectorAll('.game-over p').forEach(function(el){el.style.color = ink});
    document.querySelectorAll('.game-over .muted').forEach(function(el){el.style.color = inkSoft});
  };
  const cv = document.getElementById('g-canvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  // 十一级水果：半径、颜色、emoji、分值
  const FRUITS = [
    {r:14, color:'#e7a3b8', emoji:'🍇', name:'葡萄',   score:1},
    {r:19, color:'#e78b8b', emoji:'🍒', name:'樱桃',   score:3},
    {r:25, color:'#ef7d9a', emoji:'🍓', name:'草莓',   score:6},
    {r:32, color:'#f0d27a', emoji:'🍋', name:'金橘',   score:10},
    {r:40, color:'#f2c14e', emoji:'🍊', name:'橙子',   score:15},
    {r:49, color:'#e7623e', emoji:'🍎', name:'苹果',   score:21},
    {r:59, color:'#f5deb3', emoji:'🍐', name:'雪梨',   score:28},
    {r:70, color:'#f4a94c', emoji:'🍑', name:'水蜜桃', score:36},
    {r:82, color:'#f7e07a', emoji:'🍍', name:'菠萝',   score:45},
    {r:96, color:'#c2e07a', emoji:'🍈', name:'哈密瓜', score:55},
    {r:112,color:'#6fae5c', emoji:'🍉', name:'大西瓜', score:66},
  ];
  const LOSE_LINE = 70;
  const DEFAULT_GAME_CONFIG = {gravity: 0.45, damping: 0.994, wallBounce: 0.35, mergeBoost: 1.06};
  let gameConfig = {...DEFAULT_GAME_CONFIG};

  // 在线参数只接受服务端约定的有限范围，异常字段保留本地默认值。
  function applyGameConfig(raw){
    raw = raw && typeof raw === 'object' ? raw : {};
    const numberInRange = (value, low, high, fallback) => {
      const n = Number(value);
      return Number.isFinite(n) && n >= low && n <= high ? n : fallback;
    };
    gameConfig = {
      gravity: numberInRange(raw.gravity, 0.05, 1.5, DEFAULT_GAME_CONFIG.gravity),
      damping: numberInRange(raw.damping, 0.90, 1.0, DEFAULT_GAME_CONFIG.damping),
      wallBounce: numberInRange(raw.wall_bounce, 0.0, 1.0, DEFAULT_GAME_CONFIG.wallBounce),
      mergeBoost: numberInRange(raw.merge_boost, 0.5, 2.0, DEFAULT_GAME_CONFIG.mergeBoost)
    };
  }
  window.applyGameConfig = applyGameConfig;
  const SPIN_FRICTION = 0.25;
  const ANG_DAMPING = 0.985;
  const MAX_SPIN = 0.3;
  const SPIN_DEAD_ZONE = 0.002;   // 低于此值归零，防止持续缓慢旋转
  const COLLISION_SPEED_THRESH = 0.3; // 碰撞速度低于此值不传递自旋

  // 水果贴图：从 assets/images/fruits/ 加载
  const SPRITE_BASE = "images/fruits/";
  const SPRITES = [];
  FRUITS.forEach((f, i) => {
    const img = new Image();
    img.onload = () => { SPRITES[i] = img; };
    img.src = SPRITE_BASE + 'f' + i + '.png';
  });

  let balls = [];
  let idc = 0;
  let score = 0;
  let best = parseInt(localStorage.getItem('watermelon_best') || '0', 10);
  let dropping = null;
  let dropReady = true;
  let over = false;
  let dangerSince = null;

  document.getElementById('g-best').textContent = best;

  function randomLevel(){ return Math.floor(Math.random() * 5); }

  function newDropping(){ dropping = {x: W/2, level: randomLevel()}; dropReady = true; }

  function spawnBall(x, y, level, vx=0, vy=0){
    const f = FRUITS[level];
    balls.push({id: idc++, x, y, vx, vy, r: f.r, level, scale: 1, angle: 0, angVel: 0});
  }

  function resetGame(){
    balls = []; score = 0; over = false; dangerSince = null;
    document.getElementById('g-score').textContent = 0;
    document.getElementById('g-over').style.display = 'none';
    newDropping();
  }

  function pointerX(e){
    const rect = cv.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return (clientX - rect.left) * (W / rect.width);
  }
  function moveDroppingTo(px){
    if(!dropping || over) return;
    const r = FRUITS[dropping.level].r;
    dropping.x = Math.max(r, Math.min(W - r, px));
  }
  cv.addEventListener('mousemove', e=>{ moveDroppingTo(pointerX(e)); });

  let gTouch = null;
  cv.addEventListener('touchstart', e=>{
    if(!dropping || over) return;
    const t = e.touches[0];
    gTouch = {x: t.clientX, y: t.clientY, scroll: false};
    moveDroppingTo(pointerX(e));
  }, {passive:true});
  cv.addEventListener('touchmove', e=>{
    if(!gTouch || !dropping || over) return;
    const t = e.touches[0];
    const dx = t.clientX - gTouch.x, dy = t.clientY - gTouch.y;
    if(Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx) * 1.2) gTouch.scroll = true;
    if(!gTouch.scroll) moveDroppingTo(pointerX(e));
  }, {passive:true});
  cv.addEventListener('touchend', e=>{
    const wasScroll = gTouch && gTouch.scroll;
    gTouch = null;
    if(wasScroll) return;
    e.preventDefault();
    doDrop();
  }, {passive:false});
  cv.addEventListener('touchcancel', ()=>{ gTouch = null; });

  function doDrop(){
    if(!dropping || !dropReady || over) return;
    spawnBall(dropping.x, FRUITS[dropping.level].r + 4, dropping.level);
    dropReady = false;
    setTimeout(newDropping, 420);
  }
  cv.addEventListener('click', doDrop);

  document.getElementById('g-restart').onclick = resetGame;
  document.getElementById('g-retry').onclick = resetGame;

  function update(){
    for(const b of balls){
      b.vy += gameConfig.gravity;
      b.x += b.vx; b.y += b.vy;
      b.vx *= gameConfig.damping; b.vy *= gameConfig.damping;
      b.angVel *= ANG_DAMPING;
      if(Math.abs(b.vx) + Math.abs(b.vy) < 0.8) b.angVel *= 0.75;
      if(Math.abs(b.angVel) < SPIN_DEAD_ZONE) b.angVel = 0;
      if(b.angVel >  MAX_SPIN) b.angVel =  MAX_SPIN;
      if(b.angVel < -MAX_SPIN) b.angVel = -MAX_SPIN;
      b.angle += b.angVel;
      if(b.scale < 1) b.scale = Math.min(1, b.scale + 0.08);

      if(b.x - b.r < 0){ b.x = b.r; b.vx *= -gameConfig.wallBounce; if(Math.abs(b.vy) > 0.5) b.angVel += b.vy / b.r * 0.2; }
      if(b.x + b.r > W){ b.x = W - b.r; b.vx *= -gameConfig.wallBounce; if(Math.abs(b.vy) > 0.5) b.angVel -= b.vy / b.r * 0.2; }
      if(b.y + b.r > H){
        b.y = H - b.r; b.vy *= -gameConfig.wallBounce; if(Math.abs(b.vy)<0.6) b.vy=0;
        const rolling = b.vx / b.r;
        b.angVel += (rolling - b.angVel) * 0.15;
      }
    }

    const toMerge = [];
    const removed = new Set();
    for(let i=0;i<balls.length;i++){
      for(let j=i+1;j<balls.length;j++){
        const a=balls[i], b=balls[j];
        if(removed.has(a.id)||removed.has(b.id)) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist=Math.hypot(dx,dy) || 0.001;
        const minDist=a.r+b.r;
        if(dist < minDist){
          if(a.level===b.level && a.level < FRUITS.length-1){
            toMerge.push([a,b]);
            removed.add(a.id); removed.add(b.id);
            continue;
          }
          const overlap = (minDist - dist) / 2;
          const nx=dx/dist, ny=dy/dist;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;
          const damp=0.5;
          a.vx -= nx*overlap*damp; a.vy -= ny*overlap*damp;
          b.vx += nx*overlap*damp; b.vy += ny*overlap*damp;
          const tx=-ny, ty=nx;
          const vt = (b.vx-a.vx)*tx + (b.vy-a.vy)*ty - (a.angVel*a.r + b.angVel*b.r);
          if(Math.abs(vt) > COLLISION_SPEED_THRESH) {
            a.angVel += vt / a.r * SPIN_FRICTION;
            b.angVel += vt / b.r * SPIN_FRICTION;
          }
          a.angVel *= 0.9; b.angVel *= 0.9;
          a.vx += tx*vt*0.02; a.vy += ty*vt*0.02;
          b.vx -= tx*vt*0.02; b.vy -= ty*vt*0.02;
        }
      }
    }
    if(toMerge.length){
      for(const [a,b] of toMerge){
        const level = a.level+1;
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        spawnBall(mx, my, level, (a.vx + b.vx) / 2, (a.vy + b.vy) / 2 - gameConfig.mergeBoost);
        const nb = balls[balls.length-1];
        nb.scale = 0.7;
        nb.angle = (a.angle + b.angle) / 2;
        nb.angVel = (a.angVel + b.angVel) / 2;
        score += FRUITS[level].score;
      }
      balls = balls.filter(b=>!removed.has(b.id));
      document.getElementById('g-score').textContent = score;
      if(score > best){ best = score; localStorage.setItem('watermelon_best', best); document.getElementById('g-best').textContent = best; }
    }

    let danger = false;
    for(const b of balls){
      if(b.y - b.r < LOSE_LINE && Math.abs(b.vy) < 0.5 && b.y < H*0.6){ danger = true; break; }
    }
    if(danger){
      if(dangerSince===null) dangerSince = performance.now();
      else if(performance.now() - dangerSince > 1000){ endGame(); }
    } else {
      dangerSince = null;
    }
  }

  function endGame(){
    if(over) return;
    over = true;
    document.getElementById('g-final').textContent = score;
    document.getElementById('g-over').style.display = 'flex';
  }

  function draw(){
    var t = window.__theme;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = t.canvasBg;
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = t.accent + '80';
    ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(0,LOSE_LINE); ctx.lineTo(W,LOSE_LINE); ctx.stroke();
    ctx.setLineDash([]);

    for(const b of balls) drawFruit(b.x,b.y,b.r*b.scale,b.level,b.angle);

    if(dropping && dropReady && !over){
      const f = FRUITS[dropping.level];
      const fy = f.r + 4;
      let stopY = H - f.r;
      for(const b of balls){
        const dx = Math.abs(b.x - dropping.x);
        if(dx < b.r + f.r){
          const contactY = b.y - Math.sqrt((b.r + f.r) * (b.r + f.r) - dx * dx);
          if(contactY < stopY) stopY = contactY;
        }
      }
      ctx.strokeStyle = t.inkSoft + '99';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 7]);
      ctx.beginPath();
      ctx.moveTo(dropping.x, fy + f.r + 3);
      ctx.lineTo(dropping.x, stopY + f.r);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.globalAlpha = 0.85;
      drawFruit(dropping.x, fy, f.r, dropping.level);
      ctx.globalAlpha = 1;
    }
  }

  function drawFruit(x,y,r,level,angle=0){
    const img = SPRITES[level];
    const f = FRUITS[level];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if(img){
      ctx.drawImage(img, -r, -r, r * 2, r * 2);
      ctx.restore();
      return;
    }
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fillStyle = f.color;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(0,0,0,.06)';
    ctx.stroke();
    ctx.font = Math.max(12, r*1.1) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.emoji, 0, 1);
    ctx.restore();
  }

  function loop(){
    if(!over) update();
    draw();
    requestAnimationFrame(loop);
  }

  function pollGameConfig(){
    fetch('/api/game-config/', {cache: 'no-store'})
      .then(response => response.ok ? response.json() : null)
      .then(config => { if(config) applyGameConfig(config); })
      .catch(() => {}); // 离线时保持本地默认值/上次有效值
  }
  pollGameConfig();
  window.setInterval(pollGameConfig, 60000);

  resetGame();
  loop();
})();
</script>
</body>
</html>
